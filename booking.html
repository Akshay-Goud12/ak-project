<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style type="text/css">
        header {
            background-color: #003580;
            padding: 30px;
        }

        section {
            display: grid;
            grid-template-columns: 6fr 6fr;
        }

        .image {
            background-image: url(/images-for-projects/train-logo.png);
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;

            width: 600px;
            height: 500px;
        }

       
       input[type="checkbox"]~div button{
            display: none;
        }

        input[type="checkbox"]:checked ~div button{
            display: block;
        }
         
        form label{
            margin-top:20px;
        }
    </style>
</head>

<body class="container-fluid">
    <header class="d-flex flex-row justify-content-between align-items-center">
        <div class="h3 text-white">booking.com</div>
        <div>
            <span class="text-white">Already registered</span>
            <button type="button" class="btn btn-primary">Sign in</button>

        </div>

    </header>
    <section class="mt-5">
        <div class="ps-5">
            <form action="" class="form-control p-5">
                <label for="" class="form-label">UserName</label>
                <div class="input-group">
                    <span class="bi bi-person input-group-text"></span>
                    <input type="text" name="" id="" class="form-control">
                </div>
                <label for="" class="form-label">Email</label>
                <div class="input-group">
                    <span class="bi bi-envelope-at input-group-text"></span>
                    <input type="text" name="" id="" class="form-control">
                </div>
                <label for="" class="form-label">Mobile no</label>
                <div class="input-group">
                    <span class="bi bi-123 input-group-text"></span>
                    <input type="text" name="" id="" class="form-control">
                </div>
                <label for="" class="form-label">Otp</label>
                <div class="input-group">
                    <span class="bi bi-shield-lock input-group-text"></span>
                    <input type="text" name="" id="" class="form-control">
                </div>

                <input type="checkbox" name="accepted" id="" class=" form-check-input mt-3">
                <pre>Accept terms and conditions</pre>
                <div>
                    <button type="submit" class="btn btn-warning mt-4 w-100">Submit</button>
                </div>
            </form>
        </div>
        <div class="image">

        </div>


    </section>
</body>

</html>
